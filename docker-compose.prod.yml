version: '3.8'

services:
  app-htql:
    container_name: htqlbenhvien-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
    depends_on:
      - db-htql
    networks:
      - htql-prod-network

  db-htql:
    container_name: htqlbenhvien-db
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - htql-prod-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - htql-prod-network

  nginx-prod:
    image: nginx:alpine
    container_name: htqlbenhvien-nginx-prod
    restart: always
    ports:
      - "3001:3001" # Cổng mà Router 201 đang trỏ vào
    volumes:
      - ./nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro # Mount chứng chỉ SSL từ máy chủ vào
    depends_on:
      - app-htql
    networks:
      - htql-prod-network

networks:
  htql-prod-network:
    driver: bridge

volumes:
  htql-prod-data:
