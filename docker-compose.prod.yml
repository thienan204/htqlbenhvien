version: '3.8'

services:
  app-htql:
    container_name: htqlbenhvien-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
    depends_on:
      - db-htql
    networks:
      - htql-prod-network

  db-htql:
    container_name: htqlbenhvien-db
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - htql-prod-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - htql-prod-network

networks:
  htql-prod-network:
    driver: bridge

volumes:
  htql-prod-data:
