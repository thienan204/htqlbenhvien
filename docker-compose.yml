

services:
  nginx:
    image: nginx:alpine
    container_name: htqlbenhvien-nginx-dev
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - htql-network

  app:
    container_name: htqlbenhvien-app-dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
    depends_on:
      - db
    networks:
      - htql-network

  db:
    container_name: htqlbenhvien-db-dev
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - htql-db-data:/var/lib/postgresql/data
    networks:
      - htql-network
    ports:
      - "5433:5432"

networks:
  htql-network:
    driver: bridge

volumes:
  htql-db-data:
